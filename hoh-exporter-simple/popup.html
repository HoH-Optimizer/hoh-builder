<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>HOH Builder</h1>

  <p id="etat" class="etat">Lecture en cours…</p>

  <button id="ouvrir" class="principal">Ouvrir HOH Builder</button>
  <button id="telecharger" class="secondaire" disabled>Enregistrer un fichier de secours</button>

  <details id="avance">
    <summary>Options avancées</summary>
    <label class="case">
      <input type="checkbox" id="diagnostic">
      <span>
        <strong>Mode diagnostic</strong>
        <em>Conserve tout ce que le jeu échange, pour aider à décoder les données
          manquantes. Ralentit le jeu et produit des fichiers très lourds.</em>
      </span>
    </label>
    <button id="exportTechnique" class="secondaire" hidden>Export technique complet</button>
    <button id="effacer" class="lien">Effacer les données mémorisées</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
